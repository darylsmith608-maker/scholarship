<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Build Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header class="main-header">
        <h1>PC Build Assistant</h1>
        <p class="slogan">Define your needs, discover your build.</p>
    </header>

    <!-- Main Container -->
    <main class="container">
        
        <!-- Auth Container (Handles Login, Sign Up, and Sign Out) -->
        <section class="auth-box" id="auth-box">
            
            <!-- Shared Form Header -->
            <h2 id="auth-title">Log In</h2>

            <!-- Combined Auth Form -->
            <form id="auth-form">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="Enter your email">
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter your password">
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary">Log In</button>
            </form>

            <!-- Toggle Links -->
            <div class="toggle-container" id="toggle-container">
                <p id="toggle-text">Don't have an account? <a href="#" id="toggle-auth-link">Sign Up</a></p>
            </div>

            <!-- Profile / Sign Out View (Hidden by default via CSS/JS) -->
            <div id="user-profile" class="hidden">
                <p>Welcome back, <span id="user-email-display"></span>!</p>
                <button id="signout-btn" class="btn btn-danger">Sign Out</button>
            </div>

        </section>

    </main>

    <!-- CRITICAL: Load Supabase CDN Library FIRST -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Load your custom script SECOND -->
    <script src="script.js" defer></script>
</body>
</html>
<div class="assistant-image-container">
    <img src="images/ai-assistant.jpg" alt="Aura Personal AI Assistant v4.2 Dashboard" class="assistant-preview-img">
</div>
