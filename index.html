<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Configurator | Research & Budget</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>PC Build Assistant</h1>
            <p id="header-desc">Please login or sign up to discover your build.</p>
        </header>

        <main>
            <section id="auth-section">
                <div class="form-toggle">
                    <button id="show-login" class="active">Login</button>
                    <button id="show-signup">Sign Up</button>
                </div>

                <form id="auth-form">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="email@example.com" required>
                    </div>
                    <div class="input-group">
                        <label for="pass">Password</label>
                        <input type="password" id="pass" placeholder="••••••••" required>
                    </div>
                    
                    <div id="signup-fields" class="hidden">
                        <div class="input-group">
                            <label for="name">Full Name</label>
                            <input type="text" id="name" placeholder="John Doe">
                        </div>
                        <div class="input-group">
                            <label for="tel">Telephone</label>
                            <input type="tel" id="tel" placeholder="+1 (555) 000-0000">
                        </div>
                    </div>

                    <button type="submit" id="auth-submit-btn">Login</button>
                </form>
            </section>

            <section id="config-section" class="hidden">
                <form id="pc-form">
                    <div class="config-card">
                        <h2>Configuration</h2>
                        <div class="input-group">
                            <label for="use-case">Primary Use Case</label>
                            <select id="use-case">
                                <option value="office">Office / Research</option>
                                <option value="gaming">Gaming / High Perf</option>
                                <option value="creative">Content Creation</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label for="budget-range">Target Budget: $<span id="budget-val">800</span></label>
                            <input type="range" id="budget-range" min="400" max="3000" step="100" value="800">
                        </div>
                    </div>
                    <button type="submit" id="generate-btn">Analyze Components</button>
                </form>
            </section>

            <section id="results" class="hidden">
                <h2>Recommended Allocation</h2>
                <div id="component-list"></div>
                <div class="total-status">
                    <p>Estimated Efficiency: <strong id="efficiency">High</strong></p>
                </div>
            </section>
        </main>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
