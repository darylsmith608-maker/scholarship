<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Configurator & Subscriptions</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>PC Build Assistant</h1>
            <p>Define your needs. <strong>Discover your build.</strong></p>
        </header>

        <main>
            <section id="auth-section" class="card">
                <h2>Access Your Account</h2>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <div class="button-group">
                    <button id="login-btn">Sign In</button>
                    <button id="register-btn" class="secondary-btn">Register</button>
                </div>
                <p id="auth-message"></p>
            </section>

            <section id="config-section" class="card hidden">
                <h2>Welcome back!</h2>
                <div class="input-group">
                    <label for="use-case">Primary Use Case</label>
                    <select id="use-case">
                        <option value="office">Office / Research</option>
                        <option value="gaming">Gaming / High Perf</option>
                        <option value="creative">Content Creation</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="budget-range">Target Budget: $<span id="budget-val">800</span></label>
                    <input type="range" id="budget-range" min="400" max="3000" step="100" value="800">
                </div>
                <button id="generate-btn">Analyze Components</button>
                <button id="logout-btn" class="danger-btn">Log Out</button>
            </section>
        </main>
    </div>
   <script type="module" src="script.js"></script>
</body>
</html>
